# ============================================================================
# Build OpenKylin (2.0 SP1 / nile) image for Xiaomi Pad 6S Pro (sheng)
# 基于 openkylin-embedded-builder：debootstrap 基础 rootfs + chroot 组件层 + sheng 拼盘
# ============================================================================

name: Build OpenKylin Sheng Image

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password for user/root'
        type: string
        default: '200322'
      hostname:
        description: 'Hostname'
        type: string
        default: 'Mi-Pad-6SPro'
      boot_variant:
        description: 'Prebuilt sheng boot image variant'
        type: choice
        options:
          - singleboot
          - singleboot_plymouth
        default: singleboot

jobs:
  build-fastrpc:
    name: "Build fastrpc"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            git wget unzip dpkg-dev libyaml-dev linux-libc-dev
          echo "✓ Build tools installed"

      - name: "Download Source"
        run: |
          wget -q https://github.com/qualcomm/fastrpc/archive/refs/tags/v1.0.2.zip
          unzip -q v1.0.2.zip
          echo "✓ Source downloaded"

      - name: "Build fastrpc"
        run: |
          cd fastrpc-1.0.2
          autoreconf -is
          ./configure --prefix=/usr
          make -j$(nproc)
          mkdir -p stage
          make DESTDIR=$PWD/stage install
          echo "✓ fastrpc built"

      - name: "Add systemd Service"
        run: |
          mkdir -p fastrpc-1.0.2/stage/usr/lib/systemd/system
          cp patches/adsprpcd-sensorspd.service fastrpc-1.0.2/stage/usr/lib/systemd/system/
          echo "✓ systemd service added"

      - name: "Package fastrpc"
        run: |
          mkdir -p deb/DEBIAN
          cp -r fastrpc-1.0.2/stage/usr deb/

          cat > deb/DEBIAN/control << EOF
          Package: fastrpc
          Version: 1.0.2-1
          Section: libs
          Priority: optional
          Architecture: arm64
          Maintainer: Fauzan Amir Al Ghiffary <alghiffaryfa19@gmail.com>
          Depends: libyaml-0-2, systemd
          Description: Qualcomm FastRPC userspace library
           FastRPC implementation for Qualcomm DSP communication.
          EOF

          find deb -type d -exec chmod 755 {} \;
          find deb -type f -exec chmod 644 {} \;
          chmod 755 deb/usr/bin/adsprpcd
          dpkg-deb --build deb
          mv deb.deb fastrpc_1.0.2-1_arm64.deb
          echo "✓ fastrpc packaged"

      - name: "Upload fastrpc"
        uses: actions/upload-artifact@v7
        with:
          name: fastrpc-deb
          path: fastrpc_*.deb
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # libssc — Qualcomm Sensor Core userspace library
  # ==========================================================================
  build-libssc:
    name: "Build libssc"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build git pkg-config python3-pip \
            libglib2.0-dev libprotobuf-c-dev libqmi-glib-dev libmbim-glib-dev \
            linux-libc-dev protobuf-compiler protobuf-c-compiler
          pip3 install --upgrade meson
          echo "✓ Build tools installed"

      - name: "Clone Source"
        run: |
          git clone https://codeberg.org/DylanVanAssche/libssc.git source
          echo "✓ Source cloned"

      - name: "Apply Patch"
        run: |
          cd source
          cp "${{ github.workspace }}/patches/wait_for_qmi_service.patch" .
          patch -Np1 < wait_for_qmi_service.patch || true
          echo "✓ Patch applied"

      - name: "Build libssc"
        run: |
          cd source
          meson setup build --prefix=/usr
          meson compile -C build
          DESTDIR=$PWD/stage meson install -C build
          echo "✓ libssc built"

      - name: "Package libssc"
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r source/stage/usr/* deb/usr/

          cat > deb/DEBIAN/control << EOF
          Package: libssc
          Version: 0.3.0-1
          Section: libs
          Priority: optional
          Architecture: arm64
          Maintainer: Fauzan Amir Al Ghiffary <alghiffaryfa19@gmail.com>
          Depends: libglib2.0-0, libprotobuf-c1, libqmi-glib5
          Description: Library to expose Qualcomm Sensor Core sensors
           libssc userspace library for Qualcomm SSC.
          EOF

          find deb -type d -exec chmod 755 {} \;
          find deb -type f -exec chmod 644 {} \;
          chmod 755 deb/usr/bin/ssccli
          dpkg-deb --build deb
          mv deb.deb libssc_0.3.0-1_arm64.deb
          echo "✓ libssc packaged"

      - name: "Upload libssc"
        uses: actions/upload-artifact@v7
        with:
          name: libssc-deb
          path: libssc_*.deb
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # iio-sensor-proxy — patched with Qualcomm SSC support (needs libssc)
  # ==========================================================================
  build-iio-sensor-proxy:
    name: "Build iio-sensor-proxy"
    runs-on: ubuntu-24.04-arm
    needs: [build-libssc]

    steps:
      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config git wget dpkg-dev \
            python3-pip libglib2.0-dev libgudev-1.0-dev \
            libpolkit-gobject-1-dev libsystemd-dev libdbus-1-dev \
            systemd libqmi-glib-dev libmbim-glib-dev \
            linux-libc-dev protobuf-compiler protobuf-c-compiler
          pip3 install --upgrade meson
          echo "✓ Build tools installed"

      - name: "Download libssc"
        uses: actions/download-artifact@v8
        with:
          name: libssc-deb

      - name: "Install libssc"
        run: |
          sudo dpkg -i libssc_*.deb
          sudo ldconfig
          echo "✓ libssc installed"

      - name: "Download Source"
        run: |
          wget -q https://gitlab.freedesktop.org/hadess/iio-sensor-proxy/-/archive/3.9/iio-sensor-proxy-3.9.tar.gz
          tar -xf iio-sensor-proxy-3.9.tar.gz
          echo "✓ Source downloaded"

      - name: "Build iio-sensor-proxy"
        run: |
          cd iio-sensor-proxy-3.9
          meson setup output \
            --prefix=/usr \
            -Db_lto=true \
            -Dssc-support=enabled \
            -Dsystemdsystemunitdir=/usr/lib/systemd/system
          meson compile -C output
          DESTDIR=$PWD/stage meson install --no-rebuild -C output
          echo "✓ iio-sensor-proxy built"

      - name: "Package iio-sensor-proxy"
        run: |
          mkdir -p deb/DEBIAN
          cp -r iio-sensor-proxy-3.9/stage/usr deb/

          cat > deb/DEBIAN/control << EOF
          Package: iio-sensor-proxy
          Version: 99993.9-6
          Section: misc
          Priority: optional
          Architecture: arm64
          Maintainer: Dylan Van Assche <me@dylanvanassche.be>
          Depends: dbus, libglib2.0-0, libgudev-1.0-0, libpolkit-gobject-1-0
          Description: IIO sensors to D-Bus proxy (SSC patched)
           iio-sensor-proxy with Qualcomm SSC support patches.
          EOF

          find deb -type d -exec chmod 755 {} \;
          find deb -type f -exec chmod 644 {} \;
          chmod 755 deb/usr/bin/monitor-sensor
          chmod 755 deb/usr/libexec/iio-sensor-proxy
          dpkg-deb --build deb
          mv deb.deb iio-sensor-proxy_99993.9-6_arm64.deb
          echo "✓ iio-sensor-proxy packaged"

      - name: "Upload iio-sensor-proxy"
        uses: actions/upload-artifact@v7
        with:
          name: iio-sensor-proxy-deb
          path: iio-sensor-proxy_*.deb
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # sheng-sensors — proprietary sensor configuration files
  # ==========================================================================
  build-sheng-sensors:
    name: "Build sheng-sensors"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          echo "✓ Build tools installed"

      - name: "Package sheng-sensors"
        run: |
          mkdir -p deb/DEBIAN
          cp -r sheng-sensors-files/usr deb/

          cat > deb/DEBIAN/control << EOF
          Package: sheng-sensors
          Version: 20240917-1
          Section: misc
          Priority: optional
          Architecture: arm64
          Maintainer: Fauzan Amir Al Ghiffary <alghiffaryfa19@gmail.com>
          Description: Sensor files for Xiaomi Mi Pad 6s Pro
           Proprietary sensor configuration files.
          EOF

          find deb -type d -exec chmod 755 {} \;
          find deb -type f -exec chmod 644 {} \;

          cat > deb/DEBIAN/postinst << 'EOF'
          #!/bin/sh
          set -e
          if command -v udevadm >/dev/null 2>&1; then
            udevadm control --reload || true
            if [ -e /sys/devices/virtual/misc/fastrpc-adsp ]; then
              udevadm trigger /sys/devices/virtual/misc/fastrpc-adsp || true
            fi
          fi
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload || true
            if [ -d /run/systemd/system ]; then
              systemctl try-restart iio-sensor-proxy.service || true
            fi
          fi
          exit 0
          EOF
          chmod 755 deb/DEBIAN/postinst

          dpkg-deb --build deb
          mv deb.deb sheng-sensors_20240917-1_arm64.deb
          echo "✓ sheng-sensors packaged"

      - name: "Upload sheng-sensors"
        uses: actions/upload-artifact@v7
        with:
          name: sheng-sensors-deb
          path: sheng-sensors_*.deb
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # sheng-devauth — keyboard authentication daemon
  # ==========================================================================
  build-sheng-devauth:
    name: "Build sheng-devauth"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev git
          echo "✓ Build tools installed"

      - name: "Clone Source"
        run: |
          git clone https://github.com/ianchb/sheng_devauth.git source
          echo "✓ Source cloned"

      - name: "Build Binary"
        run: |
          cd source
          make
          echo "✓ Binary built"

      - name: "Package sheng-devauth"
        run: |
          mkdir -p sheng-devauth/usr/bin
          chmod 0755 source/xiaomi_devauth
          cp source/xiaomi_devauth sheng-devauth/usr/bin/

          cat > sheng-devauth/DEBIAN/postinst << 'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload || true
            systemctl enable sheng-devauth.service || true
            systemctl start sheng-devauth.service || true
          fi
          exit 0
          EOF
          chmod 0755 sheng-devauth/DEBIAN/postinst

          cat > sheng-devauth/DEBIAN/prerm << 'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl stop sheng-devauth.service || true
            systemctl disable sheng-devauth.service || true
          fi
          exit 0
          EOF
          chmod 0755 sheng-devauth/DEBIAN/prerm

          dpkg-deb --build --root-owner-group sheng-devauth
          echo "✓ sheng-devauth packaged"

      - name: "Upload sheng-devauth"
        uses: actions/upload-artifact@v7
        with:
          name: sheng-devauth-deb
          path: sheng-devauth.deb
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # RootFS Assembly — collects every .deb, builds the image
  # ==========================================================================

  build-rootfs:
    name: "Build OpenKylin RootFS"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    needs:
      - build-fastrpc
      - build-libssc
      - build-iio-sensor-proxy
      - build-sheng-sensors
      - build-sheng-devauth
    permissions:
      contents: read
      packages: read

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Free Disk Space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /opt/az /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          df -h /

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap gdisk mtools dosfstools genisoimage squashfs-tools xz-utils device-tree-compiler git curl wget
          echo "✓ Build tools installed"

      - name: "Download fastrpc"
        uses: actions/download-artifact@v8
        with:
          name: fastrpc-deb
          path: debs
      - name: "Download libssc"
        uses: actions/download-artifact@v8
        with:
          name: libssc-deb
          path: debs
      - name: "Download iio-sensor-proxy"
        uses: actions/download-artifact@v8
        with:
          name: iio-sensor-proxy-deb
          path: debs
      - name: "Download sheng-sensors"
        uses: actions/download-artifact@v8
        with:
          name: sheng-sensors-deb
          path: debs
      - name: "Download sheng-devauth"
        uses: actions/download-artifact@v8
        with:
          name: sheng-devauth-deb
          path: debs

      - name: "Download Prebuilt Kernel + Boot Image"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --repo ianchb/sm8550-mainline --limit 1 --json tagName -q '.[0].tagName')
          echo "kernel release: $LATEST_TAG"
          mkdir -p /tmp/boot
          gh release download "$LATEST_TAG" --repo ianchb/sm8550-mainline             --pattern "boot_sheng_${{ inputs.boot_variant }}.img" --dir /tmp/boot --clobber
          gh release download "$LATEST_TAG" --repo ianchb/sm8550-mainline             --pattern "linux-xiaomi-sheng*.deb" --dir debs --clobber
          cp -v "/tmp/boot/boot_sheng_${{ inputs.boot_variant }}.img" openkylin-builder/boot-sheng.img

      - name: "Download Device Debs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for repo in xiaomi-mipps-auth xiaomi-charger-mode xiaomi-sheng-thp xiaomi-pen-status xiaomi-sheng-fingerprint xiaomi-sheng-keyboard-helper; do
            TAG=$(gh release list --repo "ianchb/$repo" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
            if [ -n "$TAG" ]; then
              gh release download "$TAG" --repo "ianchb/$repo" --pattern "*.deb" --dir debs --clobber && echo "ok $repo"
            else
              echo "warn: no release for $repo"
            fi
          done

      - name: "Package alsa-xiaomi-sheng"
        run: dpkg-deb --build --root-owner-group alsa-xiaomi-sheng debs/alsa-xiaomi-sheng.deb

      - name: "Package firmware-xiaomi-sheng"
        run: |
          git clone --depth 1 https://github.com/ianchb/sheng-firmware.git /tmp/fw-src
          rm -rf firmware-xiaomi-sheng/usr/lib/firmware
          mkdir -p firmware-xiaomi-sheng/usr/lib/firmware
          cp -r /tmp/fw-src/. firmware-xiaomi-sheng/usr/lib/firmware/
          rm -rf firmware-xiaomi-sheng/usr/lib/firmware/.git
          dpkg-deb --build --root-owner-group firmware-xiaomi-sheng debs/firmware-xiaomi-sheng.deb

      - name: "Stage sheng debs"
        run: |
          mkdir -p openkylin-builder/config/openkylin/sheng-debs
          cp -v debs/*.deb openkylin-builder/config/openkylin/sheng-debs/ || true
          echo "--- staged:"
          ls -lh openkylin-builder/config/openkylin/sheng-debs/ | tail -20

      - name: "Build OpenKylin Image (okbuild)"
        run: |
          cd openkylin-builder
          sudo bash check-env.sh
          sudo env VK_PASSWORD="${{ inputs.password }}" VK_HOSTNAME="${{ inputs.hostname }}" ./okbuild.sh -p prop_sheng
          echo "--- outputs:"
          ls -lh rootfs.img boot.img 2>/dev/null || true
          df -h /

      - name: "Upload RootFS Image"
        uses: actions/upload-artifact@v7
        with:
          name: openkylin-sheng-rootfs
          path: |
            openkylin-builder/rootfs.img
            openkylin-builder/openKylin-*.log
          retention-days: 14
          if-no-files-found: error
          compression-level: 1

      - name: "Upload Boot Image"
        uses: actions/upload-artifact@v7
        with:
          name: openkylin-sheng-boot
          path: openkylin-builder/boot.img
          retention-days: 14
          if-no-files-found: error
